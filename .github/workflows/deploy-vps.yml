name: Deploy PIKA HOST to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pika-host-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Load VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H 4.186.148.64 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy website file
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes index.html root@4.186.148.64:/var/www/html/index.html
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@4.186.148.64 'test -s /var/www/html/index.html && echo "VPS website file verified"'
